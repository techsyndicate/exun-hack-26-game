<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Reckoning V: Origins</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      .bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100dvw;
        height: 100dvh;
        z-index: -1;
        object-fit: cover;
        object-position: bottom center;
      }
      .element {
        position: fixed;
      }
      .character {
        width: 14vw;
        height: auto;
      }
      .player {
        left: 8vw;
      }
      .opponent {
        right: 8vw;
        transform: scaleX(-1);
      }
      .blinking {
        animation-name: blink;
        animation-duration: 0.4s;
        animation-timing-function: linear;
      }
      .spinning {
        animation-name: spinning;
        animation-duration: 0.6s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }
      .tornado {
        animation-name: tornado;
        animation-duration: 0.5s;
        animation-iteration-count: infinite;
        animation-timing-function: steps(4);
      }

      @keyframes blink {
        0% {
          opacity: 1;
        }
        25% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        75% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      @keyframes spinning {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes tornado {
        0% {
          transform: scaleX(1);
        }
        50% {
          transform: scaleX(-1);
        }
      }
    </style>
  </head>
  <body>
    <div class="main">
      <img src="/assets/sky_bg.png" class="bg" />
      <img
        src="/assets/kael.svg"
        class="element character player"
        onclick="movePlayer()"
      />
      <img src="/assets/vesh.svg" class="element character opponent" />
    </div>
  </body>
  <script>
    const bgImage = document.querySelector(".bg");
    const player = document.querySelector(".player");
    const opponent = document.querySelector(".opponent");
    const playerAbilityTimeout = 500;

    let fromBottom = 0;
    let lastTime = 0;
    let playerX = 8;
    let playerY = 0;
    let playerSpeed = 20;
    let movingLeft = false;
    let movingRight = false;
    let isJumping = false;
    let abilityCooldown = false;

    function calcBottom() {
      const scale = Math.max(
        window.innerWidth / bgImage.naturalWidth,
        window.innerHeight / bgImage.naturalHeight
      );
      const displayedHeight = bgImage.naturalHeight * scale;
      fromBottom = displayedHeight * 0.126;
      const allElements = document.querySelectorAll(".element");
      for (const element of allElements) {
        element.style.bottom = `${fromBottom}px`;
      }
    }

    function blink(el) {
      el.classList.remove("blinking");
      el.classList.add("blinking");
      setTimeout(() => {
        el.classList.remove("blinking");
      }, 400);
    }
    function isTouching(el1, el2) {
      const rect1 = el1.getBoundingClientRect();
      const rect2 = el2.getBoundingClientRect();
      return !(
        rect1.top > rect2.bottom ||
        rect1.bottom < rect2.top ||
        rect1.left > rect2.right ||
        rect1.right < rect2.left
      );
    }
    window.onload = calcBottom;
    window.onresize = calcBottom;
    requestAnimationFrame(gameLoop);

    // BHAYANKAR ABILITIES

    function throwSomething(options) {
      const toThrow = document.createElement("img");
      let toThrowX = playerX + 14;
      toThrow.src = options.imgUrl;
      toThrow.className = "element";
      toThrow.style.width = options.width ?? "5vw";
      toThrow.style.left = `${toThrowX}vw`;
      toThrow.style.bottom = `${
        fromBottom + (options.bottom ?? 0.05 * window.innerWidth) + playerY
      }px`;
      if (options.class) {
        toThrow.classList.add(options.class);
      }
      document.body.appendChild(toThrow);

      const toThrowSpeed = options.speed ?? 65;
      function moveObject() {
        toThrowX += toThrowSpeed * (1 / 60);
        toThrow.style.left = `${toThrowX}vw`;
        if (isTouching(toThrow, opponent)) {
          blink(opponent);
          document.body.removeChild(toThrow);
          return;
        }
        if (toThrowX < 100) {
          requestAnimationFrame(moveObject);
        } else {
          document.body.removeChild(toThrow);
        }
      }
      requestAnimationFrame(moveObject);
    }

    function projectSomething(options) {
      const toThrow = document.createElement("img");
      let toThrowX = playerX + 14;
      let toThrowY = fromBottom + 0.05 * window.innerWidth + playerY;
      toThrow.src = options.imgUrl;
      toThrow.className = "element";
      toThrow.style.width = options.width ?? "5vw";
      toThrow.style.left = `${toThrowX}vw`;
      toThrow.style.bottom = `${toThrowY}px`;
      if (options.class) {
        toThrow.classList.add(options.class);
      }
      document.body.appendChild(toThrow);

      let angle = options.angle ?? Math.PI / 4;
      let speed = ((options.speed ?? 70) * window.innerWidth) / 100;
      const gravity = window.innerWidth;

      const initialVelocityX = speed * Math.cos(angle);
      const initialVelocityY = speed * Math.sin(angle);
      let startTime = null;

      function moveObject(timestamp) {
        if (startTime === null) startTime = timestamp;
        const timeElapsed = (timestamp - startTime) / 1000;
        const currentX =
          toThrowX +
          ((initialVelocityX * timeElapsed) / window.innerWidth) * 100;
        const currentY =
          toThrowY +
          initialVelocityY * timeElapsed -
          0.5 * gravity * timeElapsed ** 2;
        toThrow.style.left = `${currentX}vw`;
        toThrow.style.bottom = `${currentY}px`;
        if (isTouching(toThrow, opponent)) {
          blink(opponent);
          toThrow.remove();
          return;
        }
        if (currentX < 100 && currentX > -10 && currentY > fromBottom) {
          requestAnimationFrame(moveObject);
        } else {
          toThrow.remove();
        }
      }

      requestAnimationFrame(moveObject);
    }

    // KAEL

    function castFireball() {
      if (abilityCooldown) return;
      abilityCooldown = true;
      setTimeout(() => {
        abilityCooldown = false;
      }, playerAbilityTimeout);
      throwSomething({
        imgUrl: "/assets/kael/fireball.png",
        width: "6vw",
        speed: 65,
      });
    }

    function castMeteorShower() {
      if (abilityCooldown) return;
      abilityCooldown = true;
      setTimeout(() => {
        abilityCooldown = false;
      }, playerAbilityTimeout);
      for (let i = 0; i < 3; i++) {
        const meteor = document.createElement("img");
        let meteorX = 100;
        let meteorY = 0.88 * window.innerHeight - i * 0.16 * window.innerHeight;
        let lastTimeMeteor = null;
        meteor.src = "/assets/kael/meteor.png";
        meteor.className = "element";
        meteor.style.width = "5vw";
        meteor.style.left = `${meteorX}vw`;
        meteor.style.bottom = `${meteorY}px`;
        document.body.appendChild(meteor);

        const meteorSpeed = 50;
        function moveMeteor(timestamp) {
          if (lastTimeMeteor == null) lastTimeMeteor = timestamp;
          const dt = (timestamp - lastTimeMeteor) / 1000;
          lastTimeMeteor = timestamp;
          meteorX -= meteorSpeed * dt;
          meteorY -= 0.6 * window.innerHeight * dt;
          meteor.style.left = `${meteorX}vw`;
          meteor.style.bottom = `${meteorY}px`;

          if (isTouching(meteor, opponent)) {
            blink(opponent);
            document.body.removeChild(meteor);
            return;
          }
          if (meteorX > -5) {
            requestAnimationFrame(moveMeteor);
          } else {
            document.body.removeChild(meteor);
          }
        }
        setTimeout(() => {
          requestAnimationFrame(moveMeteor);
        }, i * 200);
      }
    }

    function castMolotov() {}

    // BROM

    function castMountain() {
      if (abilityCooldown) return;
      abilityCooldown = true;
      setTimeout(() => {
        abilityCooldown = false;
      }, playerAbilityTimeout);
      throwSomething({
        imgUrl: "/assets/brom/mountain.png",
        width: "14vw",
        bottom: window.innerWidth * 0.01,
        speed: 30
      });
    }

    function castRock() {
      if (abilityCooldown) return;
      abilityCooldown = true;
      setTimeout(() => {
        abilityCooldown = false;
      }, playerAbilityTimeout);
      projectSomething({
        imgUrl: "/assets/brom/rock.png",
        width: "5vw",
        angle: Math.PI / 4,
        speed: 70,
        class: "spinning",
      });
    }

    function castRoots() {
      if (abilityCooldown) return;
      abilityCooldown = true;
      setTimeout(() => {
        abilityCooldown = false;
      }, playerAbilityTimeout);
      throwSomething({
        imgUrl: "/assets/brom/roots.png",
        width: "5vw",
        speed: 75,
        class: "spinning",
      });
    }

    // NIMBRA

    function castFlood() {}

    function castTornado() {
      if (abilityCooldown) return;
      abilityCooldown = true;
      setTimeout(() => {
        abilityCooldown = false;
      }, playerAbilityTimeout);
      throwSomething({
        imgUrl: "/assets/nimbra/tornado.png",
        width: "25vw",
        speed: 20,
        class: "tornado",
        bottom: window.innerWidth * 0.01,
      });
    }

    function gameLoop(timestamp) {
      const dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;
      if (movingLeft && playerX > 0) {
        playerX -= playerSpeed * dt;
      } else if (movingRight && playerX < 100 - 14) {
        playerX += playerSpeed * dt;
      }
      player.style.left = `${playerX}vw`;
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "a") {
        movingLeft = true;
        e.preventDefault();
      } else if (e.key === "d") {
        movingRight = true;
        e.preventDefault();
      } else if (e.key === "w") {
        if (!isJumping) {
          isJumping = true;
          let maxJumpHeight = 0.1 * window.innerWidth;
          const jumpDuration = 0.45;
          const jumpStartTime = performance.now();
          function jumpLoop(currentTime) {
            const elapsed = (currentTime - jumpStartTime) / 1000;
            if (elapsed < jumpDuration) {
              playerY =
                maxJumpHeight * Math.sin((elapsed / jumpDuration) * Math.PI);
              player.style.bottom = `${fromBottom + playerY}px`;
              requestAnimationFrame(jumpLoop);
            } else {
              player.style.bottom = `${fromBottom}px`;
              isJumping = false;
            }
          }
          requestAnimationFrame(jumpLoop);
        }
      } else if (e.key === "f") {
        castFireball();
      } else if (e.key === "g") {
        castMeteorShower();
      } else if (e.key === "m") {
        castMountain();
      } else if (e.key === "r") {
        castRock();
      } else if (e.key === "t") {
        castRoots();
      } else if (e.key === "y") {
        castTornado();
      }
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === "a") {
        movingLeft = false;
      } else if (e.key === "d") {
        movingRight = false;
      }
    });
  </script>
</html>
