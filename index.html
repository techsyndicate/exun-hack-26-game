<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Reckoning V: Origins</title>
    <style>
      @font-face {
        font-family: "04b";
        src: url("assets/04b_30/04B_30__.TTF") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      @font-face {
        font-family: "Outfit";
        src: url("assets/fonts/Outfit.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
      }
      * {
        box-sizing: border-box;
      }
      button,
      a,
      input,
      textarea,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: "Outfit", sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      :root {
        --u: min(1vw, 1.8dvh);
      }
      @media (max-height: 600px) and (orientation: landscape) {
        :root {
          --u: min(1.1vw, 2.4dvh);
        }
      }
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100dvw;
        height: 100dvh;
        background-color: black;
        display: flex;
        justify-content: center;
        justify-content: safe center;
        align-items: center;
        color: white;
        flex-direction: column;
        text-align: center;
        overflow-y: auto;
        padding: calc(var(--u) * 2);
      }
      h1,
      h2,
      .hud {
        font-family: "04b", monospace;
        font-weight: normal;
      }
      .modal h1 {
        font-size: calc(var(--u) * 4);
        margin: 0px;
      }
      .modal h2 {
        font-size: calc(var(--u) * 2.6);
        margin: calc(var(--u) * 1.5) 0 0;
      }
      .modal p {
        font-size: calc(var(--u) * 1.5);
        margin: var(--u) 0;
      }
      .overlay {
        background-color: rgba(0, 0, 0, 0.85);
      }
      .loadingBar {
        border: calc(var(--u) * 0.6) solid white;
        display: flex;
        margin-top: calc(var(--u) * 2);
      }
      .loadingBox {
        width: calc(var(--u) * 1.75);
        height: calc(var(--u) * 1.75);
      }
      .loadingBoxBlue {
        background-color: rgb(59, 138, 216);
      }
      .selector {
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 3);
        margin-top: calc(var(--u) * 3);
      }
      .arrow {
        background: none;
        border: none;
        color: #777;
        font-family: "04b", monospace;
        font-size: calc(var(--u) * 4);
        padding: var(--u);
        cursor: pointer;
        touch-action: manipulation;
      }
      .arrow:hover {
        color: white;
      }
      .sorcererCard {
        width: calc(var(--u) * 40);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .sorcererInfo {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .sorcererImg {
        flex-shrink: 0;
        width: calc(var(--u) * 16);
        height: calc(var(--u) * 16);
        object-fit: contain;
        image-rendering: pixelated;
      }
      .modal .sorcererDesc {
        font-size: calc(var(--u) * 1.3);
        line-height: 1.5;
        color: #999;
      }
      .abilityList {
        display: grid;
        grid-template-columns: repeat(2, auto);
        justify-content: center;
        gap: calc(var(--u) * 0.5) calc(var(--u) * 3);
        font-size: calc(var(--u) * 1.3);
        text-align: left;
      }
      .key {
        color: #666;
        margin-right: calc(var(--u) * 0.6);
      }
      .counter {
        font-size: calc(var(--u) * 1.2);
        color: #555;
        margin-top: calc(var(--u) * 2);
      }
      .messageImg {
        width: calc(var(--u) * 12);
        height: calc(var(--u) * 12);
        object-fit: contain;
        margin: var(--u) 0;
      }
      .flipped {
        transform: scaleX(-1);
      }
      .messageButtons {
        display: flex;
        gap: calc(var(--u) * 2);
      }
      @media (max-height: 600px) and (orientation: landscape) {
        .sorcererCard {
          width: calc(var(--u) * 58);
          flex-direction: row;
          gap: calc(var(--u) * 3);
        }
        .sorcererInfo {
          align-items: flex-start;
          text-align: left;
        }
        .modal .sorcererDesc {
          font-size: calc(var(--u) * 1.4);
          margin-top: 0;
        }
        .abilityList {
          justify-content: start;
          font-size: calc(var(--u) * 1.4);
        }
        .counter,
        .selector {
          margin-top: var(--u);
        }
      }
      .bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100dvw;
        height: 100dvh;
        z-index: -1;
        object-fit: cover;
        object-position: bottom center;
      }
      .hud {
        position: fixed;
        top: 1.5vw;
        left: 0;
        width: 100vw;
        text-align: center;
        color: white;
        font-size: 2vw;
        text-shadow: 0.2vw 0.2vw 0 black;
        z-index: 500;
        display: none;
      }
      .button {
        background: none;
        color: white;
        border: calc(var(--u) * 0.2) solid white;
        padding: var(--u) calc(var(--u) * 3);
        margin-top: calc(var(--u) * 3);
        font-family: "Outfit", sans-serif;
        font-size: calc(var(--u) * 1.6);
        font-weight: 600;
        letter-spacing: 0.1em;
        cursor: pointer;
        outline: none;
        touch-action: manipulation;
      }
      .button:hover {
        background: white;
        color: black;
      }
      .element-parent {
        position: fixed;
      }
      .element {
        position: fixed;
      }
      .character {
        width: 14vw;
        height: auto;
      }
      .hpBar {
        position: absolute;
        bottom: calc(100% + 0.5vw);
        left: 50%;
        width: 10vw;
        margin-left: -5vw;
        height: 1.4vw;
        border: 0.3vw solid white;
        background-color: rgba(0, 0, 0, 0.6);
      }
      .opponent .hpBar {
        transform: scaleX(-1);
      }
      .hpFill {
        width: 100%;
        height: 100%;
        background-color: rgb(76, 209, 55);
        transition: width 0.2s linear;
      }
      .player {
        left: 8vw;
        animation-name: updown;
        animation-duration: 1.5s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }
      .opponent {
        left: 78vw;
        transform: scaleX(-1);
        animation-name: updownopp;
        animation-duration: 1.5s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }
      .blinking {
        animation-name: blink;
        animation-duration: 0.4s;
        animation-timing-function: linear;
      }
      .spinning {
        animation-name: spinning;
        animation-duration: 0.6s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }
      .tornado {
        animation-name: tornado;
        animation-duration: 0.5s;
        animation-iteration-count: infinite;
        animation-timing-function: steps(4);
      }
      .sparkle {
        animation-name: sparkle;
        animation-duration: 0.3s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }

      @keyframes blink {
        0% {
          opacity: 1;
        }
        25% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        75% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      @keyframes spinning {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes tornado {
        0% {
          transform: scaleX(1);
        }
        50% {
          transform: scaleX(-1);
        }
      }

      @keyframes sparkle {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      @keyframes updown {
        0% {
          transform: translateY(0);
        }
        25% {
          transform: translateY(-0.5vw);
        }
        50% {
          transform: translateY(0);
        }
        75% {
          transform: translateY(0.5vw);
        }
        100% {
          transform: translateY(0);
        }
      }

      @keyframes updownopp {
        0% {
          transform: scaleX(-1) translateY(0);
        }
        25% {
          transform: scaleX(-1) translateY(-0.5vw);
        }
        50% {
          transform: scaleX(-1) translateY(0);
        }
        75% {
          transform: scaleX(-1) translateY(0.5vw);
        }
        100% {
          transform: scaleX(-1) translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="modal" id="loadingModal" style="z-index: 2000">
      <h1>LOADING</h1>
      <div class="loadingBar">
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
      </div>
    </div>
    <div class="modal" id="selectModal" style="z-index: 2000; display: none">
      <h1>CHOOSE YOUR SORCERER</h1>
      <div class="selector">
        <button class="arrow" id="prevSorcerer">&lt;</button>
        <div class="sorcererCard">
          <img class="sorcererImg" id="sorcererImg" />
          <div class="sorcererInfo">
            <h2 id="sorcererName"></h2>
            <p class="sorcererDesc" id="sorcererDesc"></p>
            <div class="abilityList" id="sorcererAbilities"></div>
          </div>
        </div>
        <button class="arrow" id="nextSorcerer">&gt;</button>
      </div>
      <div class="counter" id="sorcererCounter"></div>
      <button class="button" id="selectSorcerer">SELECT</button>
    </div>
    <div class="modal overlay" id="messageModal" style="z-index: 2000; display: none">
      <h1 id="messageTitle"></h1>
      <img class="messageImg flipped" id="messageImg" />
      <p id="messageText"></p>
      <div class="messageButtons" id="messageButtons"></div>
    </div>
    <div class="hud" id="hud"></div>
    <div class="main">
      <img src="assets/sky_bg.png" class="bg" />
      <div class="element-parent player" id="player">
        <div class="hpBar"><div class="hpFill"></div></div>
        <img src="assets/vesh.svg" class="character" />
      </div>
      <div class="element-parent opponent" id="opponent">
        <div class="hpBar"><div class="hpFill"></div></div>
        <img src="assets/vesh.svg" class="character" />
      </div>
    </div>
  </body>
  <script>
    const bgImage = document.querySelector(".bg");
    const loadingModal = document.querySelector("#loadingModal");
    const selectModal = document.querySelector("#selectModal");
    const messageModal = document.querySelector("#messageModal");
    const hud = document.querySelector("#hud");
    const abilityKeys = ["Y", "A", "B"];
    const activeAbilities = new Set();

    function loadSound(src, loop = false) {
      const sound = new Audio(src);
      sound.preload = "auto";
      sound.loop = loop;
      return sound;
    }

    const menuMusic = loadSound("assets/audio/menu-music.mp3", true);
    const bgMusic = loadSound("assets/audio/bg-music.mp3", true);
    const quakeSound = loadSound("assets/audio/earthquake.mp3");
    const slashSound = loadSound("assets/audio/slash.mp3");
    let currentMusic = null;

    const PAD = {
      A: 0,
      B: 1,
      X: 2,
      Y: 3,
      START: 9,
      STICK: 10,
      UP: 12,
      LEFT: 14,
      RIGHT: 15,
    };
    const STICK_DEADZONE = 0.15;
    const STICK_MENU_THRESHOLD = 0.6;
    const STICK_JUMP_THRESHOLD = 0.6;
    const MESSAGE_INPUT_DELAY = 600;

    const ABILITY_COOLDOWN = 500;
    const SHIELD_COOLDOWN = 15000;
    const SHIELD_DURATION = 5000;
    const MAX_HP = 100;
    const CHARACTER_WIDTH = 14;
    const MIRROR_WIDTH = 100;
    const PLAYER_START_X = 8;
    const PLAYER_MIN_X = 0;
    const PLAYER_MAX_X = 45 - CHARACTER_WIDTH;
    const OPPONENT_START_X = 78;
    const OPPONENT_MIN_X = 55;
    const OPPONENT_MAX_X = 100 - CHARACTER_WIDTH;
    const LOREM =
      "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.";

    const SORCERERS = [
      {
        id: "brom",
        name: "Brom",
        img: "assets/brom.png",
        description: LOREM,
        abilities: [
          { name: "Mountain", cast: castMountain, sound: quakeSound },
          { name: "Rock", cast: castRock },
          { name: "Roots", cast: castRoots },
        ],
      },
      {
        id: "kael",
        name: "Kael",
        img: "assets/kael.svg",
        description: LOREM,
        abilities: [
          { name: "Fireball", cast: castFireball },
          { name: "Meteor Shower", cast: castMeteorShower, sound: quakeSound },
          { name: "Molotov", cast: castMolotov },
        ],
      },
      {
        id: "nimbra",
        name: "Nimbra",
        img: "assets/nimbra.png",
        description: LOREM,
        abilities: [
          { name: "Flood", cast: castFlood, sound: quakeSound },
          { name: "Tornado", cast: castTornado, sound: quakeSound },
          { name: "Water Drop", cast: castWaterDrop },
        ],
      },
      {
        id: "vesh",
        name: "Vesh",
        img: "assets/vesh.svg",
        description: LOREM,
        abilities: [
          { name: "Heal", cast: castHeal, heal: true },
          { name: "Moon Blade", cast: castMoonBlade },
          { name: "Ball", cast: castBall },
        ],
      },
    ];

    const LEVELS = [
      { castInterval: 2000, power: 1, moveSpeed: 10, dodgeChance: 0.6, shieldChance: 0.25 },
      { castInterval: 1500, power: 1.25, moveSpeed: 14, dodgeChance: 1, shieldChance: 0.4 },
      { castInterval: 1100, power: 1.5, moveSpeed: 18, dodgeChance: 1.5, shieldChance: 0.55 },
    ];

    const imageAssets = [
      "assets/vesh.svg",
      "assets/brom.png",
      "assets/nimbra.png",
      "assets/kael.svg",
      "assets/kael/fireball.png",
      "assets/kael/meteor.png",
      "assets/kael/molotov.png",
      "assets/brom/mountain.png",
      "assets/brom/rock.png",
      "assets/brom/roots.png",
      "assets/nimbra/flood.png",
      "assets/nimbra/tornado.png",
      "assets/nimbra/water_drop.png",
      "assets/vesh/heal.png",
      "assets/vesh/moon_blade.png",
      "assets/vesh/ball.png",
      "assets/shield.png",
      "assets/sky_bg.png",
    ];

    function createFighter(el, dir) {
      return {
        el,
        img: el.querySelector(".character"),
        hpFill: el.querySelector(".hpFill"),
        dir,
        x: 0,
        y: 0,
        hp: MAX_HP,
        maxHp: MAX_HP,
        power: 1,
        sorcerer: null,
        isJumping: false,
        abilityReadyAt: 0,
        shieldReadyAt: 0,
        shieldEl: null,
        targetX: 0,
        nextMoveAt: 0,
        nextCastAt: 0,
      };
    }

    const player = createFighter(document.querySelector("#player"), 1);
    const opponent = createFighter(document.querySelector("#opponent"), -1);

    let fromBottom = 0;
    let lastTime = 0;
    let playerSpeed = 20;
    let movingLeft = false;
    let movingRight = false;
    let screen = "loading";
    let gameRunning = false;
    let roundId = 0;
    let selectIndex = 0;
    let opponents = [];
    let currentLevel = 0;
    let messageShownAt = 0;
    let padX = 0;
    let padButtons = [];
    let lastPadDir = 0;

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const rand = (min, max) => min + Math.random() * (max - min);

    function loadAssets() {
      const loadingBoxes = document.querySelectorAll(".loadingBox");
      let loadedCount = 0;
      let displayedCount = 0;

      for (const asset of imageAssets) {
        const img = new Image();

        img.onload = async () => {
          loadedCount++;
          if (loadedCount === imageAssets.length) {
            while (displayedCount < loadingBoxes.length) {
              await sleep(100);
              loadingBoxes[displayedCount].classList.add("loadingBoxBlue");
              displayedCount++;
            }
            loadingModal.style.display = "none";
            showSelect();
            requestAnimationFrame(gameLoop);
          }
        };

        img.src = asset;
      }
    }

    function calcBottom() {
      const scale = Math.max(
        window.innerWidth / bgImage.naturalWidth,
        window.innerHeight / bgImage.naturalHeight
      );
      const displayedHeight = bgImage.naturalHeight * scale;
      fromBottom = displayedHeight * 0.126;
      const allElements = document.querySelectorAll(".element");
      const allParents = document.querySelectorAll(".element-parent");
      for (const element of allElements) {
        element.style.bottom = `${fromBottom}px`;
      }
      for (const parent of allParents) {
        parent.style.bottom = `${fromBottom}px`;
      }
    }

    function blink(el) {
      el.classList.remove("blinking");
      el.classList.add("blinking");
      setTimeout(() => {
        el.classList.remove("blinking");
      }, 400);
    }
    function isTouching(el1, el2) {
      const rect1 = el1.getBoundingClientRect();
      const rect2 = el2.getBoundingClientRect();
      return !(
        rect1.top > rect2.bottom ||
        rect1.bottom < rect2.top ||
        rect1.left > rect2.right ||
        rect1.right < rect2.left
      );
    }

    function playMusic(track, restart = false) {
      for (const music of [menuMusic, bgMusic]) {
        if (music !== track) music.pause();
      }
      currentMusic = track;
      if (restart) track.currentTime = 0;
      track.play().catch(() => {});
    }

    function playSound(sound) {
      sound.currentTime = 0;
      sound.play().catch(() => {});
    }

    function resumeMusic() {
      if (currentMusic && currentMusic.paused) {
        currentMusic.play().catch(() => {});
      }
    }

    window.onload = calcBottom;
    window.onresize = calcBottom;
    document.addEventListener("pointerdown", resumeMusic);
    document.addEventListener("keydown", resumeMusic);

    function renderSelect() {
      const sorcerer = SORCERERS[selectIndex];
      document.querySelector("#sorcererImg").src = sorcerer.img;
      document.querySelector("#sorcererName").textContent =
        sorcerer.name.toUpperCase();
      document.querySelector("#sorcererDesc").textContent =
        sorcerer.description;
      document.querySelector("#sorcererCounter").textContent = `${
        selectIndex + 1
      } / ${SORCERERS.length}`;

      const list = document.querySelector("#sorcererAbilities");
      list.innerHTML = "";
      const items = [
        { key: "X", name: "Shield" },
        ...sorcerer.abilities.map((ability, i) => ({
          key: abilityKeys[i],
          name: ability.name,
        })),
      ];
      for (const item of items) {
        const row = document.createElement("div");
        const key = document.createElement("span");
        key.className = "key";
        key.textContent = item.key;
        row.append(key, item.name);
        list.appendChild(row);
      }
    }

    function changeSelection(step) {
      selectIndex = (selectIndex + step + SORCERERS.length) % SORCERERS.length;
      renderSelect();
    }

    function showSelect() {
      screen = "select";
      messageModal.style.display = "none";
      hud.style.display = "none";
      selectModal.style.display = "flex";
      renderSelect();
      playMusic(menuMusic);
    }

    function chooseSorcerer() {
      if (screen !== "select") return;
      player.sorcerer = SORCERERS[selectIndex];
      opponents = SORCERERS.filter((s) => s !== player.sorcerer);
      currentLevel = 0;
      player.img.src = player.sorcerer.img;
      selectModal.style.display = "none";
      showLevelIntro();
    }

    function showMessage({ title, text, img, buttons }) {
      screen = "message";
      document.querySelector("#messageTitle").textContent = title;
      document.querySelector("#messageText").textContent = text;
      const messageImg = document.querySelector("#messageImg");
      messageImg.style.display = img ? "block" : "none";
      if (img) messageImg.src = img;
      const container = document.querySelector("#messageButtons");
      container.innerHTML = "";
      for (const { label, onClick } of buttons) {
        const button = document.createElement("button");
        button.className = "button";
        button.textContent = label;
        button.addEventListener("click", onClick);
        container.appendChild(button);
      }
      messageModal.style.display = "flex";
      messageShownAt = performance.now();
      playMusic(menuMusic);
    }

    function showLevelIntro() {
      const next = opponents[currentLevel];
      showMessage({
        title: `LEVEL ${currentLevel + 1}`,
        text: `${player.sorcerer.name} vs ${next.name}`,
        img: next.img,
        buttons: [{ label: "FIGHT", onClick: startLevel }],
      });
    }

    function updateHpBar(f) {
      const pct = (f.hp / f.maxHp) * 100;
      f.hpFill.style.width = `${pct}%`;
      f.hpFill.style.backgroundColor =
        pct > 50
          ? "rgb(76, 209, 55)"
          : pct > 25
          ? "rgb(251, 197, 49)"
          : "rgb(232, 65, 24)";
    }

    function resetFighter(f, sorcerer, x) {
      f.sorcerer = sorcerer;
      f.img.src = sorcerer.img;
      f.x = x;
      f.y = 0;
      f.targetX = x;
      f.isJumping = false;
      f.el.style.bottom = `${fromBottom}px`;
      f.hp = f.maxHp;
      f.abilityReadyAt = 0;
      f.shieldReadyAt = 0;
      f.shieldEl = null;
      updateHpBar(f);
    }

    function clearArena() {
      roundId++;
      for (const ability of activeAbilities) {
        ability.remove();
      }
      activeAbilities.clear();
      document.querySelectorAll(".effect").forEach((el) => el.remove());
      player.shieldEl = null;
      opponent.shieldEl = null;
      movingLeft = false;
      movingRight = false;
    }

    function startLevel() {
      clearArena();
      messageModal.style.display = "none";
      const config = LEVELS[currentLevel];
      resetFighter(player, player.sorcerer, PLAYER_START_X);
      resetFighter(opponent, opponents[currentLevel], OPPONENT_START_X);
      opponent.power = config.power;
      opponent.nextMoveAt = performance.now() + 1000;
      opponent.nextCastAt = performance.now() + 1500;
      hud.textContent = `LEVEL ${currentLevel + 1}/${opponents.length} - ${
        player.sorcerer.name
      } vs ${opponent.sorcerer.name}`.toUpperCase();
      hud.style.display = "block";
      screen = "game";
      gameRunning = true;
      playMusic(bgMusic, true);
    }

    function endRound(won) {
      if (!gameRunning) return;
      gameRunning = false;
      movingLeft = false;
      movingRight = false;
      const defeated = opponent.sorcerer;
      setTimeout(() => {
        clearArena();
        if (!won) {
          showMessage({
            title: "DEFEATED",
            text: `${defeated.name} wins this round.`,
            img: defeated.img,
            buttons: [
              { label: "RETRY", onClick: showLevelIntro },
              { label: "CHANGE SORCERER", onClick: showSelect },
            ],
          });
          return;
        }
        currentLevel++;
        if (currentLevel >= opponents.length) {
          showMessage({
            title: "VICTORY",
            text: `${player.sorcerer.name} has defeated every sorcerer!`,
            buttons: [{ label: "PLAY AGAIN", onClick: showSelect }],
          });
        } else {
          showMessage({
            title: "LEVEL COMPLETE",
            text: `${defeated.name} has been defeated.`,
            buttons: [{ label: "NEXT LEVEL", onClick: showLevelIntro }],
          });
        }
      }, 900);
    }

    function damageFighter(f, amount) {
      if (!gameRunning) return;
      f.hp = Math.max(0, f.hp - amount);
      updateHpBar(f);
      blink(f.el);
      if (f.hp <= 0) endRound(f === opponent);
    }

    function healFighter(f, amount) {
      f.hp = Math.min(f.maxHp, f.hp + amount);
      updateHpBar(f);
    }

    function otherFighter(f) {
      return f === player ? opponent : player;
    }

    function frameX(f) {
      return f.dir === 1 ? f.x : MIRROR_WIDTH - f.x - CHARACTER_WIDTH;
    }

    function sideX(f, x, width) {
      return f.dir === 1 ? x : MIRROR_WIDTH - x - width;
    }

    function createProjectile(f, imgUrl, width, className) {
      const el = document.createElement("img");
      el.src = imgUrl;
      el.className = "element";
      el.style.width = `${width}vw`;
      if (className) {
        el.classList.add(className);
        if (f.dir === -1) el.style.animationDirection = "reverse";
      } else if (f.dir === -1) {
        el.style.transform = "scaleX(-1)";
      }
      el.owner = f;
      activeAbilities.add(el);
      document.body.appendChild(el);
      return el;
    }

    function removeProjectile(el) {
      activeAbilities.delete(el);
      el.remove();
    }

    function checkHit(el, caster, damage) {
      if (!el.isConnected) return true;
      const target = otherFighter(caster);
      if (target.shieldEl && isTouching(el, target.shieldEl)) {
        removeProjectile(el);
        return true;
      }
      if (isTouching(el, target.el)) {
        removeProjectile(el);
        damageFighter(target, damage * caster.power);
        return true;
      }
      return false;
    }

    function isRoundActive(round) {
      return gameRunning && round === roundId;
    }

    function throwSomething(f, options) {
      if (!gameRunning) return;
      const width = options.width ?? 5;
      const toThrow = createProjectile(f, options.imgUrl, width, options.class);
      let toThrowX = sideX(f, frameX(f) + 13, width);
      toThrow.style.left = `${toThrowX}vw`;
      toThrow.style.bottom = `${
        fromBottom + (options.bottom ?? 0.05 * window.innerWidth + f.y)
      }px`;

      const toThrowSpeed = (options.speed ?? 65) * f.dir;
      let last = null;
      function moveObject(timestamp) {
        if (last === null) last = timestamp;
        const dt = (timestamp - last) / 1000;
        last = timestamp;
        toThrowX += toThrowSpeed * dt;
        toThrow.style.left = `${toThrowX}vw`;
        if (checkHit(toThrow, f, options.damage ?? 10)) return;
        if (toThrowX < 100 && toThrowX > -width - 5) {
          requestAnimationFrame(moveObject);
        } else {
          removeProjectile(toThrow);
        }
      }
      requestAnimationFrame(moveObject);
    }

    function projectSomething(f, options) {
      if (!gameRunning) return;
      const width = options.width ?? 5;
      const toThrow = createProjectile(f, options.imgUrl, width, options.class);
      let toThrowX = sideX(f, options.left ?? frameX(f) + 14, width);
      let toThrowY =
        options.bottom ?? fromBottom + 0.05 * window.innerWidth + f.y;
      toThrow.style.left = `${toThrowX}vw`;
      toThrow.style.bottom = `${toThrowY}px`;

      let angle = options.angle ?? Math.PI / 4;
      let speed = ((options.speed ?? 70) * window.innerWidth) / 100;
      const gravity = options.gravity ?? window.innerWidth;

      const initialVelocityX = speed * Math.cos(angle) * f.dir;
      const initialVelocityY = speed * Math.sin(angle);
      let startTime = null;

      function moveObject(timestamp) {
        if (startTime === null) startTime = timestamp;
        const timeElapsed = (timestamp - startTime) / 1000;
        const currentX =
          toThrowX +
          ((initialVelocityX * timeElapsed) / window.innerWidth) * 100;
        const currentY =
          toThrowY +
          initialVelocityY * timeElapsed -
          0.5 * gravity * timeElapsed ** 2;
        toThrow.style.left = `${currentX}vw`;
        toThrow.style.bottom = `${currentY}px`;
        if (checkHit(toThrow, f, options.damage ?? 10)) return;
        if (currentX < 100 && currentX > -10 && currentY > fromBottom) {
          requestAnimationFrame(moveObject);
        } else {
          removeProjectile(toThrow);
        }
      }

      requestAnimationFrame(moveObject);
    }

    function useAbility(f, index) {
      if (!gameRunning) return;
      const now = performance.now();
      if (now < f.abilityReadyAt) return;
      f.abilityReadyAt = now + ABILITY_COOLDOWN;
      const ability = f.sorcerer.abilities[index];
      playSound(ability.sound ?? slashSound);
      ability.cast(f);
    }

    function castShield(f) {
      if (!gameRunning) return;
      const now = performance.now();
      if (now < f.shieldReadyAt) return;
      f.shieldReadyAt = now + SHIELD_COOLDOWN;
      playSound(slashSound);
      const shieldImage = document.createElement("img");
      shieldImage.src = "assets/shield.png";
      shieldImage.className = "effect";
      shieldImage.style.width = "6vw";
      shieldImage.style.bottom = `2vw`;
      shieldImage.style.left = `14vw`;
      shieldImage.style.position = "absolute";
      f.el.appendChild(shieldImage);
      f.shieldEl = shieldImage;
      setTimeout(() => {
        if (f.shieldEl === shieldImage) f.shieldEl = null;
        shieldImage.remove();
      }, SHIELD_DURATION);
    }

    function jump(f) {
      if (!gameRunning || f.isJumping) return;
      f.isJumping = true;
      const round = roundId;
      const maxJumpHeight = 0.1 * window.innerWidth;
      const jumpDuration = 0.45;
      const jumpStartTime = performance.now();
      function jumpLoop(currentTime) {
        const elapsed = (currentTime - jumpStartTime) / 1000;
        if (elapsed < jumpDuration && round === roundId) {
          f.y = maxJumpHeight * Math.sin((elapsed / jumpDuration) * Math.PI);
          f.el.style.bottom = `${fromBottom + f.y}px`;
          requestAnimationFrame(jumpLoop);
        } else {
          f.y = 0;
          f.el.style.bottom = `${fromBottom}px`;
          f.isJumping = false;
        }
      }
      requestAnimationFrame(jumpLoop);
    }

    function castFireball(f) {
      throwSomething(f, {
        imgUrl: "assets/kael/fireball.png",
        width: 6,
        speed: 65,
        damage: 10,
      });
    }

    function castMeteorShower(f) {
      const round = roundId;
      const damage = 6;
      for (let i = 0; i < 3; i++) {
        setTimeout(() => {
          if (!isRoundActive(round)) return;
          const width = 5;
          const meteor = createProjectile(f, "assets/kael/meteor.png", width);
          let meteorX = sideX(f, 100, width);
          let meteorY =
            0.88 * window.innerHeight - i * 0.16 * window.innerHeight;
          let lastTimeMeteor = null;
          meteor.style.left = `${meteorX}vw`;
          meteor.style.bottom = `${meteorY}px`;

          const meteorSpeed = 50 * f.dir;
          function moveMeteor(timestamp) {
            if (lastTimeMeteor == null) lastTimeMeteor = timestamp;
            const dt = (timestamp - lastTimeMeteor) / 1000;
            lastTimeMeteor = timestamp;
            meteorX -= meteorSpeed * dt;
            meteorY -= 0.6 * window.innerHeight * dt;
            meteor.style.left = `${meteorX}vw`;
            meteor.style.bottom = `${meteorY}px`;
            if (checkHit(meteor, f, damage)) return;
            if (meteorX > -15 && meteorX < 105 && meteorY > -200) {
              requestAnimationFrame(moveMeteor);
            } else {
              removeProjectile(meteor);
            }
          }
          requestAnimationFrame(moveMeteor);
        }, i * 200);
      }
    }

    function castMolotov(f) {
      projectSomething(f, {
        imgUrl: "assets/kael/meteor.png",
        width: 5,
        angle: Math.PI / 4,
        speed: 70,
        class: "spinning",
        damage: 12,
      });
    }

    function castMountain(f) {
      throwSomething(f, {
        imgUrl: "assets/brom/mountain.png",
        width: 14,
        bottom: window.innerWidth * 0.01,
        speed: 30,
        damage: 15,
      });
    }

    function castRock(f) {
      projectSomething(f, {
        imgUrl: "assets/brom/rock.png",
        width: 5,
        angle: Math.PI / 4,
        speed: 70,
        class: "spinning",
        damage: 10,
      });
    }

    function castRoots(f) {
      throwSomething(f, {
        imgUrl: "assets/brom/roots.png",
        width: 5,
        speed: 75,
        class: "spinning",
        bottom: window.innerWidth * 0.01,
        damage: 8,
      });
    }

    function castFlood(f) {
      const round = roundId;
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          if (!isRoundActive(round)) return;
          projectSomething(f, {
            imgUrl: "assets/nimbra/flood.png",
            width: 9,
            speed: 30,
            bottom: window.innerHeight,
            left: i * 18 + 10,
            angle: -(Math.PI / 2),
            gravity: 0,
            damage: 5,
          });
        }, i * 200);
      }
    }

    function castTornado(f) {
      throwSomething(f, {
        imgUrl: "assets/nimbra/tornado.png",
        width: 21,
        speed: 20,
        class: "tornado",
        bottom: window.innerWidth * 0.01,
        damage: 15,
      });
    }

    function castWaterDrop(f) {
      projectSomething(f, {
        imgUrl: "assets/nimbra/water_drop.png",
        width: 5,
        angle: (5.1 * Math.PI) / 4,
        speed: 70,
        bottom: 0.88 * window.innerHeight,
        left: 95,
        gravity: 0,
        damage: 10,
      });
    }

    function castHeal(f) {
      healFighter(f, 20);
      const healImage = document.createElement("img");
      healImage.src = "assets/vesh/heal.png";
      healImage.className = "sparkle effect";
      healImage.style.width = "6vw";
      healImage.style.bottom = `2vw`;
      healImage.style.left = `5vw`;
      healImage.style.position = "absolute";
      f.el.appendChild(healImage);
      setTimeout(() => {
        healImage.remove();
      }, 600);
    }

    function castMoonBlade(f) {
      throwSomething(f, {
        imgUrl: "assets/vesh/moon_blade.png",
        width: 4,
        speed: 65,
        class: "spinning",
        damage: 10,
      });
    }

    function castBall(f) {
      throwSomething(f, {
        imgUrl: "assets/vesh/ball.png",
        width: 4,
        speed: 65,
        class: "spinning",
        damage: 8,
      });
    }

    function updateOpponent(dt, now) {
      const o = opponent;
      const config = LEVELS[currentLevel];

      if (now >= o.nextMoveAt) {
        o.targetX = rand(OPPONENT_MIN_X, OPPONENT_MAX_X);
        o.nextMoveAt = now + rand(1000, 2500);
      }
      const step = config.moveSpeed * dt;
      o.x += Math.max(-step, Math.min(step, o.targetX - o.x));

      let incoming = false;
      for (const ability of activeAbilities) {
        if (ability.owner === player) {
          incoming = true;
          break;
        }
      }
      if (incoming && Math.random() < config.dodgeChance * dt) jump(o);

      if (now >= o.nextCastAt) {
        o.nextCastAt = now + config.castInterval * rand(0.7, 1.3);
        if (
          incoming &&
          now >= o.shieldReadyAt &&
          Math.random() < config.shieldChance
        ) {
          castShield(o);
          return;
        }
        const abilities = o.sorcerer.abilities;
        const choices = abilities
          .map((_, i) => i)
          .filter((i) => !abilities[i].heal || o.hp < o.maxHp * 0.6);
        useAbility(o, choices[Math.floor(Math.random() * choices.length)]);
      }
    }

    function getGamepad() {
      for (const pad of navigator.getGamepads?.() ?? []) {
        if (pad && pad.connected) return pad;
      }
      return null;
    }

    function pollGamepad(now) {
      const pad = getGamepad();
      if (!pad) {
        padX = 0;
        padButtons = [];
        return;
      }

      const down = pad.buttons.map((button) => button.pressed);
      const wasDown = padButtons;
      const justPressed = (i) => down[i] && !wasDown[i];
      padButtons = down;

      let x = pad.axes[0] ?? 0;
      const y = pad.axes[1] ?? 0;
      if (Math.abs(x) < STICK_DEADZONE) x = 0;
      if (down[PAD.LEFT]) x = -1;
      if (down[PAD.RIGHT]) x = 1;
      padX = x;

      const dir = x > STICK_MENU_THRESHOLD ? 1 : x < -STICK_MENU_THRESHOLD ? -1 : 0;
      const confirm =
        justPressed(PAD.A) || justPressed(PAD.START) || justPressed(PAD.STICK);

      if (screen === "select") {
        if (dir !== 0 && dir !== lastPadDir) changeSelection(dir);
        if (confirm) chooseSorcerer();
      } else if (screen === "message") {
        if (now - messageShownAt > MESSAGE_INPUT_DELAY) {
          const choices = document.querySelectorAll("#messageButtons button");
          if (confirm) choices[0]?.click();
          else if (justPressed(PAD.B) && choices.length > 1) choices[1].click();
        }
      } else if (gameRunning) {
        if (y < -STICK_JUMP_THRESHOLD || down[PAD.UP]) jump(player);
        if (justPressed(PAD.X)) castShield(player);
        if (justPressed(PAD.Y)) useAbility(player, 0);
        if (justPressed(PAD.A)) useAbility(player, 1);
        if (justPressed(PAD.B)) useAbility(player, 2);
      }
      lastPadDir = dir;
    }

    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;
      pollGamepad(timestamp);
      if (gameRunning) {
        let move = (movingRight ? 1 : 0) - (movingLeft ? 1 : 0);
        if (move === 0) move = padX;
        player.x = Math.max(
          PLAYER_MIN_X,
          Math.min(PLAYER_MAX_X, player.x + playerSpeed * move * dt)
        );
        updateOpponent(dt, timestamp);
      }
      player.el.style.left = `${player.x}vw`;
      opponent.el.style.left = `${opponent.x}vw`;
      requestAnimationFrame(gameLoop);
    }

    document
      .querySelector("#prevSorcerer")
      .addEventListener("click", () => changeSelection(-1));
    document
      .querySelector("#nextSorcerer")
      .addEventListener("click", () => changeSelection(1));
    document
      .querySelector("#selectSorcerer")
      .addEventListener("click", chooseSorcerer);

    document.addEventListener("keydown", (e) => {
      if (screen === "select") {
        if (e.key === "ArrowLeft") changeSelection(-1);
        else if (e.key === "ArrowRight") changeSelection(1);
        else if (e.key === "Enter") chooseSorcerer();
        return;
      }
      if (!gameRunning) return;
      if (e.key === "a") {
        movingLeft = true;
        e.preventDefault();
      } else if (e.key === "d") {
        movingRight = true;
        e.preventDefault();
      } else if (e.key === "w") {
        jump(player);
      }
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === "a") {
        movingLeft = false;
      } else if (e.key === "d") {
        movingRight = false;
      }
    });

    loadAssets();
  </script>
</html>
