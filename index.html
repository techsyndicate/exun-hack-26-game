<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Reckoning V: Origins</title>
    <style>
      @font-face {
        font-family: "Pixeloid Sans";
        src: url("/assets/fonts/PixeloidSans.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      * {
        box-sizing: border-box;
      }
      button,
      a,
      input,
      textarea,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: "Pixeloid Sans", sans-serif;
      }
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100dvw;
        height: 100dvh;
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        flex-direction: column;
      }
      .modal h1 {
        font-size: 4vw;
        margin: 0px;
      }
      .loadingBar {
        border: 0.6vw solid white;
        display: flex;
        margin-top: 2vw;
      }
      .loadingBox {
        width: 1.75vw;
        height: 1.75vw;
      }
      .loadingBoxBlue {
        background-color: rgb(59, 138, 216);
      }
      .bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100dvw;
        height: 100dvh;
        z-index: -1;
        object-fit: cover;
        object-position: bottom center;
      }
      .buttons {
        position: fixed;
        width: 8vw;
        height: 100dvh;
        z-index: 1000;
        right: 0;
        top: 0;
        background: rgba(0, 0, 0, 0.9);
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        align-items: center;
        padding: 2vw 0;
      }
      .button {
        background-color: #444;
        color: white;
        width: 6vw;
        height: 6vw;
        font-size: 2.1vw;
        border: none;
        border-radius: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0px 0.55vw 0px #999;
        cursor: pointer;
        outline: none;
        font-family: "Pixeloid Sans", sans-serif;
      }
      .button:active {
        box-shadow: 0px 0.2vw 0px #999;
        transform: translateY(0.25vw);
      }
      .element-parent {
        position: fixed;
      }
      .element {
        position: fixed;
      }
      .character {
        width: 14vw;
        height: auto;
      }
      .player {
        left: 8vw;
        animation-name: updown;
        animation-duration: 1.5s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }
      .opponent {
        right: 15vw;
        transform: scaleX(-1);
        animation-name: updownopp;
        animation-duration: 1.5s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }
      .blinking {
        animation-name: blink;
        animation-duration: 0.4s;
        animation-timing-function: linear;
      }
      .spinning {
        animation-name: spinning;
        animation-duration: 0.6s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }
      .tornado {
        animation-name: tornado;
        animation-duration: 0.5s;
        animation-iteration-count: infinite;
        animation-timing-function: steps(4);
      }
      .sparkle {
        animation-name: sparkle;
        animation-duration: 0.3s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }

      @keyframes blink {
        0% {
          opacity: 1;
        }
        25% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        75% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      @keyframes spinning {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes tornado {
        0% {
          transform: scaleX(1);
        }
        50% {
          transform: scaleX(-1);
        }
      }

      @keyframes sparkle {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      @keyframes updown {
        0% {
          transform: translateY(0);
        }
        25% {
          transform: translateY(-0.5vw);
        }
        50% {
          transform: translateY(0);
        }
        75% {
          transform: translateY(0.5vw);
        }
        100% {
          transform: translateY(0);
        }
      }

      @keyframes updownopp {
        0% {
          transform: scaleX(-1) translateY(0);
        }
        25% {
          transform: scaleX(-1) translateY(-0.5vw);
        }
        50% {
          transform: scaleX(-1) translateY(0);
        }
        75% {
          transform: scaleX(-1) translateY(0.5vw);
        }
        100% {
          transform: scaleX(-1) translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="modal" style="z-index: 2000">
      <h1>LOADING</h1>
      <div class="loadingBar">
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
        <div class="loadingBox"></div>
      </div>
    </div>
    <div class="buttons">
      <button class="button">X</button>
      <button class="button">Y</button>
      <button class="button">A</button>
      <button class="button">B</button>
    </div>
    <div class="main">
      <img src="/assets/sky_bg.png" class="bg" />
      <div class="element-parent player" id="player">
        <img src="/assets/vesh.svg" class="character" onclick="movePlayer()" />
      </div>
      <div class="element-parent opponent" id="opponent">
        <img src="/assets/vesh.svg" class="character" />
      </div>
    </div>
  </body>
  <script>
    const bgImage = document.querySelector(".bg");
    const player = document.querySelector(".player");
    const opponent = document.querySelector(".opponent");
    const playerAbilityTimeout = 500;
    const shieldCooldownTime = 15000;
    const activeAbilities = new Set();

    const imageAssets = [
      "/assets/vesh.svg",
      "/assets/brom.png",
      "/assets/nimbra.png",
      "/assets/kael.svg",
      "/assets/kael/fireball.png",
      "/assets/kael/meteor.png",
      "/assets/kael/molotov.png",
      "/assets/brom/mountain.png",
      "/assets/brom/rock.png",
      "/assets/brom/roots.png",
      "/assets/nimbra/flood.png",
      "/assets/nimbra/tornado.png",
      "/assets/nimbra/water_drop.png",
      "/assets/vesh/heal.png",
      "/assets/vesh/moon_blade.png",
      "/assets/vesh/ball.png",
      "/assets/shield.png",
      "/assets/sky_bg.png",
    ];

    let fromBottom = 0;
    let lastTime = 0;
    let playerX = 8;
    let playerY = 0;
    let playerSpeed = 20;
    let movingLeft = false;
    let movingRight = false;
    let isJumping = false;
    let abilityCooldown = false;
    let shieldCooldown = false;

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function loadAssets() {
      const loadingBoxes = document.querySelectorAll(".loadingBox");
      let loadedCount = 0;
      let displayedCount = 0;

      for (const asset of imageAssets) {
        const img = new Image();

        img.onload = async () => {
          loadedCount++;
          if (loadedCount === imageAssets.length) {
            while (displayedCount < loadingBoxes.length) {
              await sleep(100);
              loadingBoxes[displayedCount].classList.add("loadingBoxBlue");
              displayedCount++;
            }
            document.querySelector(".modal").style.display = "none";
            requestAnimationFrame(gameLoop);
          }
        };

        img.src = asset;
      }
    }

    function calcBottom() {
      const scale = Math.max(
        window.innerWidth / bgImage.naturalWidth,
        window.innerHeight / bgImage.naturalHeight
      );
      const displayedHeight = bgImage.naturalHeight * scale;
      fromBottom = displayedHeight * 0.126;
      const allElements = document.querySelectorAll(".element");
      const allParents = document.querySelectorAll(".element-parent");
      for (const element of allElements) {
        element.style.bottom = `${fromBottom}px`;
      }
      for (const parent of allParents) {
        parent.style.bottom = `${fromBottom}px`;
      }
    }

    function blink(el) {
      el.classList.remove("blinking");
      el.classList.add("blinking");
      setTimeout(() => {
        el.classList.remove("blinking");
      }, 400);
    }
    function isTouching(el1, el2) {
      const rect1 = el1.getBoundingClientRect();
      const rect2 = el2.getBoundingClientRect();
      return !(
        rect1.top > rect2.bottom ||
        rect1.bottom < rect2.top ||
        rect1.left > rect2.right ||
        rect1.right < rect2.left
      );
    }

    window.onload = calcBottom;
    window.onresize = calcBottom;

    // BHAYANKAR ABILITIES

    function throwSomething(options) {
      const toThrow = document.createElement("img");
      let toThrowX = playerX + 13;
      toThrow.src = options.imgUrl;
      toThrow.className = "element playerAbility";
      toThrow.style.width = options.width ?? "5vw";
      toThrow.style.left = `${toThrowX}vw`;
      toThrow.style.bottom = `${
        fromBottom + (options.bottom ?? 0.05 * window.innerWidth + playerY)
      }px`;
      if (options.class) {
        toThrow.classList.add(options.class);
      }
      activeAbilities.add(toThrow);
      document.body.appendChild(toThrow);

      const toThrowSpeed = options.speed ?? 65;
      function moveObject() {
        toThrowX += toThrowSpeed * (1 / 60);
        toThrow.style.left = `${toThrowX}vw`;
        if (isTouching(toThrow, opponent)) {
          blink(opponent);
          activeAbilities.delete(toThrow);
          toThrow.remove();
          return;
        }
        if (toThrowX < 100) {
          requestAnimationFrame(moveObject);
        } else {
          activeAbilities.delete(toThrow);
          toThrow.remove();
        }
      }
      requestAnimationFrame(moveObject);
    }

    function projectSomething(options) {
      const toThrow = document.createElement("img");
      let toThrowX = options.left ?? playerX + 14;
      let toThrowY =
        options.bottom ?? fromBottom + 0.05 * window.innerWidth + playerY;
      toThrow.src = options.imgUrl;
      toThrow.className = "element playerAbility";
      toThrow.style.width = options.width ?? "5vw";
      toThrow.style.left = `${toThrowX}vw`;
      toThrow.style.bottom = `${toThrowY}px`;
      if (options.class) {
        toThrow.classList.add(options.class);
      }
      activeAbilities.add(toThrow);
      document.body.appendChild(toThrow);

      let angle = options.angle ?? Math.PI / 4;
      let speed = ((options.speed ?? 70) * window.innerWidth) / 100;
      const gravity = options.gravity ?? window.innerWidth;

      const initialVelocityX = speed * Math.cos(angle);
      const initialVelocityY = speed * Math.sin(angle);
      let startTime = null;

      function moveObject(timestamp) {
        if (startTime === null) startTime = timestamp;
        const timeElapsed = (timestamp - startTime) / 1000;
        const currentX =
          toThrowX +
          ((initialVelocityX * timeElapsed) / window.innerWidth) * 100;
        const currentY =
          toThrowY +
          initialVelocityY * timeElapsed -
          0.5 * gravity * timeElapsed ** 2;
        toThrow.style.left = `${currentX}vw`;
        toThrow.style.bottom = `${currentY}px`;
        if (isTouching(toThrow, opponent)) {
          blink(opponent);
          activeAbilities.delete(toThrow);
          toThrow.remove();
          return;
        }
        if (currentX < 100 && currentX > -10 && currentY > fromBottom) {
          requestAnimationFrame(moveObject);
        } else {
          activeAbilities.delete(toThrow);
          toThrow.remove();
        }
      }

      requestAnimationFrame(moveObject);
    }

    function castShield() {
      if (shieldCooldown) return;
      shieldCooldown = true;
      setTimeout(() => {
        shieldCooldown = false;
      }, shieldCooldownTime);
      const shieldImage = document.createElement("img");
      shieldImage.src = "/assets/shield.png";
      shieldImage.style.width = "6vw";
      shieldImage.style.bottom = `2vw`;
      shieldImage.style.left = `14vw`;
      shieldImage.style.position = "absolute";
      document.querySelector("#player").appendChild(shieldImage);
      setTimeout(() => {
        document.querySelector("#player").removeChild(shieldImage);
      }, 5000);
      let pehleWala = 0;
      function checkCollision(timestamp) {
        if (pehleWala === 0) pehleWala = timestamp;
        const dt = timestamp - pehleWala;
        for (const ability of activeAbilities) {
          if (
            !ability.classList.contains("playerAbility") &&
            isTouching(ability, shieldImage)
          ) {
            activeAbilities.delete(ability);
            ability.remove();
          }
        }
        if (dt > 5000) {
          return;
        } else {
          requestAnimationFrame(checkCollision);
        }
      }
      requestAnimationFrame(checkCollision);
    }

    // KAEL

    function castFireball() {
      if (abilityCooldown) return;
      abilityCooldown = true;
      setTimeout(() => {
        abilityCooldown = false;
      }, playerAbilityTimeout);
      throwSomething({
        imgUrl: "/assets/kael/fireball.png",
        width: "6vw",
        speed: 65,
      });
    }

    function castMeteorShower() {
      if (abilityCooldown) return;
      abilityCooldown = true;
      setTimeout(() => {
        abilityCooldown = false;
      }, playerAbilityTimeout);
      for (let i = 0; i < 3; i++) {
        const meteor = document.createElement("img");
        let meteorX = 100;
        let meteorY = 0.88 * window.innerHeight - i * 0.16 * window.innerHeight;
        let lastTimeMeteor = null;
        meteor.src = "/assets/kael/meteor.png";
        meteor.className = "element playerAbility";
        meteor.style.width = "5vw";
        meteor.style.left = `${meteorX}vw`;
        meteor.style.bottom = `${meteorY}px`;
        activeAbilities.add(meteor);
        document.body.appendChild(meteor);

        const meteorSpeed = 50;
        function moveMeteor(timestamp) {
          if (lastTimeMeteor == null) lastTimeMeteor = timestamp;
          const dt = (timestamp - lastTimeMeteor) / 1000;
          lastTimeMeteor = timestamp;
          meteorX -= meteorSpeed * dt;
          meteorY -= 0.6 * window.innerHeight * dt;
          meteor.style.left = `${meteorX}vw`;
          meteor.style.bottom = `${meteorY}px`;

          if (isTouching(meteor, opponent)) {
            blink(opponent);
            activeAbilities.delete(meteor);
            meteor.remove();
            return;
          }
          if (meteorX > -5) {
            requestAnimationFrame(moveMeteor);
          } else {
            activeAbilities.delete(meteor);
            meteor.remove();
          }
        }
        setTimeout(() => {
          requestAnimationFrame(moveMeteor);
        }, i * 200);
      }
    }

    function castMolotov() {
      if (abilityCooldown) return;
      abilityCooldown = true;
      setTimeout(() => {
        abilityCooldown = false;
      }, playerAbilityTimeout);
      projectSomething({
        imgUrl: "/assets/kael/meteor.png",
        width: "5vw",
        angle: Math.PI / 4,
        speed: 70,
        class: "spinning",
      });
    }

    // BROM

    function castMountain() {
      if (abilityCooldown) return;
      abilityCooldown = true;
      setTimeout(() => {
        abilityCooldown = false;
      }, playerAbilityTimeout);
      throwSomething({
        imgUrl: "/assets/brom/mountain.png",
        width: "14vw",
        bottom: window.innerWidth * 0.01,
        speed: 30,
      });
    }

    function castRock() {
      if (abilityCooldown) return;
      abilityCooldown = true;
      setTimeout(() => {
        abilityCooldown = false;
      }, playerAbilityTimeout);
      projectSomething({
        imgUrl: "/assets/brom/rock.png",
        width: "5vw",
        angle: Math.PI / 4,
        speed: 70,
        class: "spinning",
      });
    }

    function castRoots() {
      if (abilityCooldown) return;
      abilityCooldown = true;
      setTimeout(() => {
        abilityCooldown = false;
      }, playerAbilityTimeout);
      throwSomething({
        imgUrl: "/assets/brom/roots.png",
        width: "5vw",
        speed: 75,
        class: "spinning",
        bottom: window.innerWidth * 0.01,
      });
    }

    // NIMBRA

    function castFlood() {
      if (abilityCooldown) return;
      abilityCooldown = true;
      setTimeout(() => {
        abilityCooldown = false;
      }, playerAbilityTimeout);
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          projectSomething({
            imgUrl: "/assets/nimbra/flood.png",
            width: "9vw",
            speed: 30,
            bottom: window.innerHeight,
            left: i * 18 + 10,
            angle: -(Math.PI / 2),
            gravity: 0,
          });
        }, i * 200);
      }
    }

    function castTornado() {
      if (abilityCooldown) return;
      abilityCooldown = true;
      setTimeout(() => {
        abilityCooldown = false;
      }, playerAbilityTimeout);
      throwSomething({
        imgUrl: "/assets/nimbra/tornado.png",
        width: "21vw",
        speed: 20,
        class: "tornado",
        bottom: window.innerWidth * 0.01,
      });
    }

    function castWaterDrop() {
      if (abilityCooldown) return;
      abilityCooldown = true;
      setTimeout(() => {
        abilityCooldown = false;
      }, playerAbilityTimeout);
      projectSomething({
        imgUrl: "/assets/nimbra/water_drop.png",
        width: "5vw",
        angle: (5.1 * Math.PI) / 4,
        speed: 70,
        bottom: 0.88 * window.innerHeight,
        left: 95,
        gravity: 0,
      });
    }

    // VESH

    function castHeal() {
      if (abilityCooldown) return;
      abilityCooldown = true;
      setTimeout(() => {
        abilityCooldown = false;
      }, playerAbilityTimeout);
      const healImage = document.createElement("img");
      healImage.src = "/assets/vesh/heal.png";
      healImage.className = "sparkle";
      healImage.style.width = "6vw";
      healImage.style.bottom = `2vw`;
      healImage.style.left = `5vw`;
      healImage.style.position = "absolute";
      document.querySelector("#player").appendChild(healImage);
      setTimeout(() => {
        document.querySelector("#player").removeChild(healImage);
      }, 600);
    }

    function castMoonBlade() {
      if (abilityCooldown) return;
      abilityCooldown = true;
      setTimeout(() => {
        abilityCooldown = false;
      }, playerAbilityTimeout);
      throwSomething({
        imgUrl: "/assets/vesh/moon_blade.png",
        width: "4vw",
        speed: 65,
        class: "spinning",
      });
    }

    function castBall() {
      if (abilityCooldown) return;
      abilityCooldown = true;
      setTimeout(() => {
        abilityCooldown = false;
      }, playerAbilityTimeout);
      throwSomething({
        imgUrl: "/assets/vesh/ball.png",
        width: "4vw",
        speed: 65,
        class: "spinning",
      });
    }

    function gameLoop(timestamp) {
      const dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;
      if (movingLeft && playerX > 0) {
        playerX -= playerSpeed * dt;
      } else if (movingRight && playerX < 45 - 14) {
        playerX += playerSpeed * dt;
      }
      player.style.left = `${playerX}vw`;
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "a") {
        movingLeft = true;
        e.preventDefault();
      } else if (e.key === "d") {
        movingRight = true;
        e.preventDefault();
      } else if (e.key === "w") {
        if (!isJumping) {
          isJumping = true;
          let maxJumpHeight = 0.1 * window.innerWidth;
          const jumpDuration = 0.45;
          const jumpStartTime = performance.now();
          function jumpLoop(currentTime) {
            const elapsed = (currentTime - jumpStartTime) / 1000;
            if (elapsed < jumpDuration) {
              playerY =
                maxJumpHeight * Math.sin((elapsed / jumpDuration) * Math.PI);
              player.style.bottom = `${fromBottom + playerY}px`;
              requestAnimationFrame(jumpLoop);
            } else {
              player.style.bottom = `${fromBottom}px`;
              isJumping = false;
            }
          }
          requestAnimationFrame(jumpLoop);
        }
      } else if (e.key === "f") {
        castFireball();
      } else if (e.key === "g") {
        castMeteorShower();
      } else if (e.key === "m") {
        castMountain();
      } else if (e.key === "r") {
        castRock();
      } else if (e.key === "t") {
        castRoots();
      } else if (e.key === "y") {
        castTornado();
      } else if (e.key === "p") {
        castWaterDrop();
      } else if (e.key === "h") {
        castHeal();
      } else if (e.key === "b") {
        castMoonBlade();
      } else if (e.key === "n") {
        castBall();
      } else if (e.key === "x") {
        castShield();
      } else if (e.key === "j") {
        castFlood();
      } else if (e.key === "l") {
        castMolotov();
      }
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === "a") {
        movingLeft = false;
      } else if (e.key === "d") {
        movingRight = false;
      }
    });

    loadAssets();
  </script>
</html>
